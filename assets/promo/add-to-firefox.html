<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeetSRS — Add to Firefox button</title>
    <!-- Styles copied from LeetLanding PR #51, commit c3276c0. -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: transparent;
        font-family: "Geist", system-ui, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .install-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: var(--green);
        color: #142218;
        font-weight: 650;
        font-size: 15px;
        text-decoration: none;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.15s;
        white-space: nowrap;
      }
      .install-button:hover {
        background: #a0e8a9;
        transform: translateY(-1px);
      }
      .chrome {
        background: #f1f3ee;
        border-color: #f1f3ee;
        color: #202520;
      }
      .chrome:hover {
        background: #fff;
        border-color: #fff;
      }
      .firefox {
        background: #35233f;
        border-color: #755181;
        color: #fff4ff;
      }
      .firefox:hover {
        background: #463052;
        border-color: #b17fc2;
      }
      .browser-logo {
        display: block;
        width: 28px;
        height: 28px;
        flex: none;
      }
      .external-arrow {
        margin-left: 2px;
        font-size: 15px;
        font-weight: 400;
        opacity: 0.65;
      }
      .compact {
        padding: 10px 15px;
        font-size: 13px;
      }
      @media (max-width: 380px) {
        .install-button:not(.compact) {
          gap: 10px;
          padding-inline: 14px;
          font-size: 14px;
        }
        .compact {
          padding: 9px 11px;
        }
      }
    </style>
  </head>
  <body>
    <a class="install-button firefox" href="https://addons.mozilla.org/en-US/firefox/addon/leetsrs/">
      <img
        class="browser-logo"
        src="browsers/firefox.svg"
        width="28"
        height="28"
        alt=""
      />
      <span>Add to Firefox</span>
      <span class="external-arrow" aria-hidden="true">↗</span>
    </a>
  </body>
</html>
