<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="size" content="584x104" />
    <meta name="alpha" />
    <title>LeetSRS — Add to Chrome button</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap");
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: Geist, sans-serif;
      }
    </style>
    <style>
      html,
      body {
        width: 584px;
        height: 104px;
        background: transparent;
      }
      body::before {
        display: none;
      }
      a {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        border-radius: 18px;
        background: #80d78c;
        color: #142218;
        text-decoration: none;
        font-size: 36px;
        font-weight: 650;
        letter-spacing: -0.5px;
      }
      .browser,
      svg {
        width: 44px;
        height: 44px;
        flex: none;
      }
      .arrow {
        width: 32px;
        height: 32px;
        margin: 0 0 0 4px;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <a>
      <img class="browser" src="browsers/chrome.svg" alt="" />
      <span>Add LeetSRS to Chrome</span>
      <svg
        class="arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 17 17 7M8 7h9v9" />
      </svg>
    </a>
  </body>
</html>
