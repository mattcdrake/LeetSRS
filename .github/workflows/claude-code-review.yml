name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]

jobs:
  claude-review:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Forces tag mode, so the action's built-in review prompt is used.
          # Only valid for opened/reopened/ready_for_review/synchronize/labeled.
          track_progress: true

          # A prompt is what fires the trigger on pull_request events; tag mode
          # layers it onto the built-in prompt as <custom_instructions>.
          prompt: |
            Read and follow AGENTS.md and .agents/skills/code-review/SKILL.md,
            then review this pull request.

          claude_args: |
            --allowedTools "Read,Glob,Grep,Agent,TaskOutput,TaskStop,mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git status:*),Bash(git show:*)"
