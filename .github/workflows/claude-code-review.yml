name: Claude Code Review

on:
  pull_request:
    types: [opened, review_requested]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. Be concise. Only mention things that actually matter:
            - Bugs, logic errors, or edge cases that will break
            - Security issues
            - Significant performance problems (not micro-optimizations)
            - Suggestions that meaningfully improve the code

            Do NOT comment on: naming conventions, missing comments, test coverage suggestions, or vague "could be cleaner" feedback.

            If the code is solid, just say "LGTM".

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
