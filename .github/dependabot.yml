version: 2

updates:
  - package-ecosystem: npm
    directory: /
    labels: [dependencies]
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies]
    schedule:
      interval: weekly
