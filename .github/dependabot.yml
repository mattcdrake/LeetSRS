version: 2

updates:
  - package-ecosystem: npm
    directory: /
    labels: [enhancement]
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    labels: [enhancement]
    schedule:
      interval: weekly
